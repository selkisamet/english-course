# Günlük hatırlatmalar için YEDEK tetikleyici. Asıl zamanlayıcı cron-job.org (5 dakikada bir,
# aynı uca aynı anahtarla POST). GitHub zamanlanmış işleri saatlerce geciktirebildiği için tek
# başına yeterli değil; asıl zamanlayıcı bir süre çalışmazsa günün hatırlatması bununla gider.
# Sunucu aynı kişiye aynı gün ikinci kez göndermez (server/reminders.js › claimDay).
name: Günlük hatırlatmalar (yedek)

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hatırlatmaları gönder
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://english-course-qlsk.onrender.com' }}
        run: |
          # Gizli anahtar henüz eklenmediyse (kurulum sürerken) hata vermeden atla
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET tanımlı değil, atlanıyor"; exit 0; fi
          # Uyuyan sunucu ilk istekte uyanır; bu yüzden birkaç kez denenir
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 120 -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders"
